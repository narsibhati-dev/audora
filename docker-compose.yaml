services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_HTTP_URL: http://backend:9000
        NEXT_PUBLIC_SIGNALING_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      signal:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_HTTP_URL: http://backend:9000
      NEXT_PUBLIC_SIGNALING_URL: ws://localhost:8000
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    ports:
      - "9000:9000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  signal:
    build:
      context: .
      dockerfile: docker/signal.prod.Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: audora_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audora
    volumes:
      - audora_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audora_user -d audora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  audora_postgres_data:
